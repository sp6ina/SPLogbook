[package]
name = "splogbook"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Mariusz Woźniak (SP6INA) <contact@splogbook.org>"]
description = "SPLogbook: Nowoczesny, zaawansowany program logujący dla krótkofalowców"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/sp6ina/SPLogbook"

[lib]
name = "splogbook"
path = "src/lib.rs"

[[bin]]
name = "SPLogbook"
path = "src/main.rs"

[[bin]]
name = "splogbook-signer"
path = "src/bin/signer.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.13"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "query", "form"] }
log = "0.4"
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.17"

# Audio, export, and API
rodio = { version = "0.22", default-features = false, features = ["wav", "playback"] }
cpal = "0.18"
rustfft = "6.4"
printpdf = "0.12"
gpx = "0.10"
axum = { version = "0.8", features = ["tokio", "ws"] }
open = "5"
geo-types = "0.7"
keyring = "4.2"
uuid = { version = "1", features = ["v4"] }
rhai = { version = "1", features = ["sync"] }
chacha20poly1305 = "0.11"
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
flate2 = "1.1.10"
tar = "0.4.46"
walkdir = "2.5.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
base64 = "0.23.1"
semver = "1.0.28"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3.27"
tower = "0.5"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
