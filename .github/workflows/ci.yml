name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository contains no tracked secrets or private keys (SEC-001)
        run: |
          FORBIDDEN_FILES=$(git ls-files | grep -E '(^|/)(scratch\.rs|\.signer_priv\.key|klucz\.key|\.test\.key|.*\.p12|.*\.pfx)$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::Tracked private key or forbidden secret file detected in repository:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          PEM_FILES=$(git ls-files '*.pem' || true)
          for f in $PEM_FILES; do
            if grep -q "PRIVATE KEY" "$f" 2>/dev/null; then
              echo "::error::Tracked private key detected in PEM file: $f"
              exit 1
            fi
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libgtk-3-dev \
            libusb-1.0-0-dev \
            libudev-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features
