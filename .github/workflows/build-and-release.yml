            2>&1 | tee flatpak-negative.log
          test -s flatpak-negative.log
          grep -q "FLATPAK NEGATIVE FIXTURES COMPLETED SUCCESSFULLY" flatpak-negative.log
          grep -Eq "Negative fixtures: [0-9]+/[0-9]+ rejected" flatpak-negative.log

      - name: Upload the negative-fixture evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
