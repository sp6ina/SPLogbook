name: Build and Release SPLogbook

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run validation (do not publish GitHub Release)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libgtk-3-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            patchelf \
            xvfb

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run unit and security tests
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable test cloud::updater
          cargo +stable test archive_
          cargo +stable test updater_install_flattens_single_root_directory_on_linux
          cargo +stable test updater_rolls_back_when_linux_rename_fails
          cargo +stable test updater_install_sets_clean_permissions_on_unix
          cargo +stable test --test security_guard
          xvfb-run --auto-servernum cargo test -- --nocapture 2>&1 | tee test_output.log || {
            ERR_MSG=$(tail -n 30 test_output.log | tr '\n' ' ')
            echo "::error file=src/lib.rs,line=1::Tests failed: $ERR_MSG"
            exit 1
          }

      - name: Compile release binary
        run: cargo build --release

      - name: Build Hamlib 4.7.2 for Linux
        run: |
          echo "Downloading and compiling Hamlib 4.7.2 for Linux release..."
          HAMLIB_VERSION="4.7.2"
          wget -q "https://github.com/Hamlib/Hamlib/releases/download/${HAMLIB_VERSION}/hamlib-${HAMLIB_VERSION}.tar.gz"
          tar -xzf "hamlib-${HAMLIB_VERSION}.tar.gz"
          cd "hamlib-${HAMLIB_VERSION}"
          ./configure \
            --prefix=/tmp/hamlib-dist \
            --disable-static \
            --enable-shared \
            --without-cxx-binding \
            --without-perl-binding \
            --without-python-binding \
            --without-tcl-binding \
            --without-lua-binding
          make -j$(nproc)
          make install
          strip /tmp/hamlib-dist/bin/* || true
          strip /tmp/hamlib-dist/lib/*.so* || true
          cd ..
          rm -rf "hamlib-${HAMLIB_VERSION}" "hamlib-${HAMLIB_VERSION}.tar.gz"

      - name: Package Linux release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          HAMLIB_DIST="/tmp/hamlib-dist" bash scripts/build_linux_portable_tar_gz.sh dist
          cp dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz SPLogbook-Linux-x86_64.tar.gz

      - name: Audit Linux ELF and Hamlib binaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit-staging
          tar -xzf dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz -C /tmp/audit-staging

          echo "=== ELF AUDIT: SPLogbook ==="
          file /tmp/audit-staging/SPLogbook/SPLogbook
          readelf -h /tmp/audit-staging/SPLogbook/SPLogbook
          readelf -l /tmp/audit-staging/SPLogbook/SPLogbook
          readelf -d /tmp/audit-staging/SPLogbook/SPLogbook
          readelf --version-info /tmp/audit-staging/SPLogbook/SPLogbook
          ldd /tmp/audit-staging/SPLogbook/SPLogbook || true

          echo "=== ELF AUDIT: splogbook-updater ==="
          file /tmp/audit-staging/SPLogbook/splogbook-updater
          readelf -h /tmp/audit-staging/SPLogbook/splogbook-updater
          readelf -l /tmp/audit-staging/SPLogbook/splogbook-updater
          readelf -d /tmp/audit-staging/SPLogbook/splogbook-updater
          readelf --version-info /tmp/audit-staging/SPLogbook/splogbook-updater
          ldd /tmp/audit-staging/SPLogbook/splogbook-updater || true

          if [ -f /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4 ]; then
            echo "=== ELF AUDIT: libhamlib.so.4 ==="
            file /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4
            readelf -h /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4
            readelf -d /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4
            readelf --version-info /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4
            ldd /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4 || true
          fi
          rm -rf /tmp/audit-staging

      - name: Upload Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPLogbook-Linux-x86_64
          path: |
            dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz
            dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz.sha256
            SPLogbook-Linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run unit and security tests
        shell: pwsh
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable test cloud::updater
          cargo +stable test windows_production_zip_path
          cargo +stable test updater_uses_zip_extension_for_windows_archive
          cargo +stable test updater_rolls_back_when_windows_replace_fails
          cargo +stable test updater_install_flattens_single_root_directory_and_uses_zip_on_windows
          cargo +stable test --test security_guard
          cargo test --verbose

      - name: Compile release binary
        run: cargo build --release

      - name: Package Windows release archive
        shell: pwsh
        run: |
          $pkgDir = "SPLogbook-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$pkgDir\databases" | Out-Null
          Copy-Item target\release\SPLogbook.exe "$pkgDir\"
          Copy-Item assets\icon.ico "$pkgDir\"
          Copy-Item databases\serviceLOG.db "$pkgDir\databases\"
          if (Test-Path databases\callbook.db) { Copy-Item databases\callbook.db "$pkgDir\databases\" }
          Copy-Item README.md "$pkgDir\"
          Copy-Item LICENSE "$pkgDir\"

          # Download and bundle pre-built Hamlib 4.7.2 binaries (rigctld, rotctld, and DLLs)
          Write-Host "Downloading Hamlib 4.7.2 for Windows..."
          $hamlibZip = "hamlib-w64-4.7.2.zip"
          $hamlibUrl = "https://github.com/Hamlib/Hamlib/releases/download/4.7.2/$hamlibZip"
          Invoke-WebRequest -Uri $hamlibUrl -OutFile $hamlibZip
          Expand-Archive -Path $hamlibZip -DestinationPath "hamlib-tmp" -Force
          Copy-Item "hamlib-tmp\hamlib-w64-4.7.2\bin\*" "$pkgDir\" -Force
          New-Item -ItemType Directory -Force -Path "$pkgDir\hamlib" | Out-Null
          Copy-Item "hamlib-tmp\hamlib-w64-4.7.2" "$pkgDir\hamlib\" -Recurse -Force
          Remove-Item -Recurse -Force "hamlib-tmp", $hamlibZip

          Compress-Archive -Path "$pkgDir\*" -DestinationPath "SPLogbook-Windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPLogbook-Windows-x64
          path: SPLogbook-Windows-x64.zip
          if-no-files-found: error

  verify-linux-matrix:
    name: Verify Linux (${{ matrix.name }})
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 26.10 Stonking Stingray"
            distro_id: "ubuntu-stable"
            image: "ubuntu:26.10@sha256:262df65c0ec6bf8d9dcc87454f4330a05fae4b97825f45854af3b136666584c2"
            pkg_query: "dpkg-query -W linux-image-generic libc6"
          - name: "Ubuntu 26.04.1 LTS Resolute Raccoon"
            distro_id: "ubuntu-lts"
            image: "ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
            pkg_query: "dpkg-query -W linux-image-generic libc6"
          - name: "Debian 13.7 Trixie"
            distro_id: "debian-stable"
            image: "debian:13.7@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6"
            pkg_query: "dpkg-query -W linux-image-amd64 libc6"
          - name: "Fedora Linux 45 Final/GA"
            distro_id: "fedora-final"
            image: "fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c"
            pkg_query: "rpm -q kernel-core glibc libgcc libstdc++"
          - name: "Arch Linux Rolling Snapshot"
            distro_id: "arch-rolling"
            image: "archlinux:base-20261101.0.620205@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9"
            pkg_query: "pacman -Q linux glibc; pacman-conf --repo-list"
          - name: "openSUSE Leap 16.1"
            distro_id: "opensuse-leap"
            image: "opensuse/leap:16.1@sha256:756634f02c733fc52d5c9aa09aca6374c91c53c675dd445743736e13a8428858"
            pkg_query: "rpm -q kernel-default glibc; zypper lr -u"
          - name: "openSUSE Tumbleweed"
            distro_id: "opensuse-tumbleweed"
            image: "opensuse/tumbleweed:latest@sha256:6e3a892daa0372e12a9c0b10291303dbfcd8706a450de6edfd72c763b44b4ac1"
            pkg_query: "rpm -q kernel-default glibc; zypper lr -u"
    steps:
      - name: Download Linux release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64
          path: download/

      - name: Verify immutable SHA-256 and execute multi-distribution native validation
        run: |
          set -euo pipefail
          echo "=== PULLING PINNED OCI IMAGE ==="
          docker pull "${{ matrix.image }}"

          CANONICAL_SHA=$(awk '{print $1}' download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz.sha256)
          echo "Canonical SHA-256: ${CANONICAL_SHA}"

          mkdir -p test_env/evidence
          cp download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz test_env/
          cp download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz.sha256 test_env/

          cat << 'CONTAINER_SCRIPT' > test_env/run_test.sh
          #!/bin/sh
          set -e
          echo "=== 1. OS & KERNEL PROFILE ==="
          cat /etc/os-release
          uname -a
          uname -r
          uname -m
          getconf GNU_LIBC_VERSION || true
          ldd --version || true

          echo "=== 2. DISTRO PACKAGE METADATA ==="
          eval "${PKG_QUERY_CMD}" || true

          echo "=== 3. SHA-256 INTEGRITY CHECK ==="
          sha256sum -c SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz.sha256

          echo "=== 4. ARCHIVE PREFLIGHT & SAFE EXTRACTION ==="
          tar -ztvf SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz | head -30
          tar -xzf SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz
          [ -d "SPLogbook" ] || { echo "Root SPLogbook directory missing"; exit 1; }
          [ -f "SPLogbook/.splogbook-linux-portable-marker" ] || { echo "Portable marker missing"; exit 1; }
          cat "SPLogbook/.splogbook-linux-portable-marker"

          echo "=== 5. ELF & LOADER VALIDATION ==="
          file SPLogbook/SPLogbook
          ldd SPLogbook/SPLogbook || true

          echo "=== 6. BINARY LAUNCH & IDENTITY CHECK ==="
          SPLogbook/SPLogbook --version || true
          SPLogbook/SPLogbook --build-info || true

          echo "=== 7. ISOLATED XDG & DATA PRESERVATION FIXTURE ==="
          TEST_HOME="/tmp/isolated_home"
          mkdir -p "${TEST_HOME}"
          export HOME="${TEST_HOME}"
          export XDG_CONFIG_HOME="${TEST_HOME}/.config"
          export XDG_DATA_HOME="${TEST_HOME}/.local/share"
          export XDG_STATE_HOME="${TEST_HOME}/.local/state"
          export XDG_CACHE_HOME="${TEST_HOME}/.cache"

          # Initialize dummy user databases
          mkdir -p "${XDG_DATA_HOME}/splogbook"
          echo "USER_LOG_INITIAL_DATA" > "${XDG_DATA_HOME}/splogbook/default_log.db"
          INITIAL_DB_SHA=$(sha256sum "${XDG_DATA_HOME}/splogbook/default_log.db" | awk '{print $1}')

          echo "=== 8. TRANSACTIONAL ROLLBACK FIXTURE ==="
          mkdir -p SPLogbook/.rollback
          cp SPLogbook/SPLogbook SPLogbook/.rollback/SPLogbook.orig
          echo "NEW_TEST_BINARY" > SPLogbook/SPLogbook
          # Rollback
          cp SPLogbook/.rollback/SPLogbook.orig SPLogbook/SPLogbook
          rm -rf SPLogbook/.rollback

          FINAL_DB_SHA=$(sha256sum "${XDG_DATA_HOME}/splogbook/default_log.db" | awk '{print $1}')
          if [ "${INITIAL_DB_SHA}" != "${FINAL_DB_SHA}" ]; then
            echo "ERROR: User data modified during fixture!"
            exit 1
          fi
          echo "User database byte exactness verified: ${FINAL_DB_SHA}"
          echo "NATIVE VERIFICATION COMPLETED SUCCESSFULLY"
CONTAINER_SCRIPT
          chmod +x test_env/run_test.sh

          docker run --rm             -e PKG_QUERY_CMD="${{ matrix.pkg_query }}"             -v "$(pwd)/test_env:/workspace"             -w /workspace             "${{ matrix.image }}"             /bin/sh /workspace/run_test.sh | tee "test_env/evidence/native-evidence-${{ matrix.distro_id }}.log"

      - name: Upload native evidence log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-${{ matrix.distro_id }}
          path: test_env/evidence/native-evidence-${{ matrix.distro_id }}.log
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: [build-linux, build-windows, verify-linux-matrix]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libgtk-3-dev \
            libusb-1.0-0-dev \
            libudev-dev

      - name: Build splogbook-signer
        run: cargo build --release --bin splogbook-signer

      - name: Stage and verify release artifacts completeness
        run: |
          set -euo pipefail
          mkdir -p release-staging

          cp SPLogbook-Linux-x86_64/SPLogbook-Linux-x86_64.tar.gz release-staging/
          cp SPLogbook-Windows-x64/SPLogbook-Windows-x64.zip release-staging/

          [ -s release-staging/SPLogbook-Linux-x86_64.tar.gz ] || { echo "::error::Missing or empty Linux artifact"; exit 1; }
          [ -s release-staging/SPLogbook-Windows-x64.zip ] || { echo "::error::Missing or empty Windows artifact"; exit 1; }

          COUNT=$(find release-staging -maxdepth 1 -type f | wc -l)
          [ "$COUNT" -eq 2 ] || { echo "::error::Unexpected artifact count in staging: $COUNT"; exit 1; }

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-staging
          sha256sum SPLogbook-Linux-x86_64.tar.gz SPLogbook-Windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create, sign and verify Release Manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY || secrets.SPLOGBOOK_31102026 }}
          IS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false') }}
        run: |
          set -euo pipefail

          EXPECTED_KEY_ID="splogbook-release-2026-02"
          EXPECTED_FINGERPRINT="2a6277b72d2a97236f344f1542a1c2868a74f71c9626a22dc1735919efeb2a4a"
          SIGNER_BIN="$(pwd)/target/release/splogbook-signer"

          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if [ "$IS_DRY_RUN" = "true" ]; then
              printf '::warning::Signing secret is not configured; generating ephemeral dry-run key for pipeline validation\n'
              "$SIGNER_BIN" keygen dry_run.key
              trap 'rm -f dry_run.key priv.key ../dry_run.key ../priv.key' EXIT
              KEY_FILE="dry_run.key"
              KEY_MODE="EPHEMERAL"
            else
              printf '::error::Release signing key secret is missing or empty. Publication cannot proceed without signature.\n'
              exit 1
            fi
          else
            umask 077
            if echo "$RELEASE_SIGNING_KEY" | base64 -d > priv.key 2>/dev/null && [ "$(stat -c%s priv.key)" -eq 32 ]; then
              chmod 600 priv.key
            elif printf '%s' "$RELEASE_SIGNING_KEY" > priv.key && [ "$(stat -c%s priv.key)" -eq 32 ]; then
              chmod 600 priv.key
            else
              printf '::error::RELEASE_SIGNING_KEY must decode to exactly 32 raw secret bytes\n'
              rm -f priv.key
              exit 1
            fi
            trap 'rm -f priv.key dry_run.key ../priv.key ../dry_run.key' EXIT

            ACTUAL_FP=$("$SIGNER_BIN" fingerprint priv.key | grep "Fingerprint SHA-256:" | awk '{print $NF}')
            if [ "$ACTUAL_FP" != "$EXPECTED_FINGERPRINT" ]; then
              printf '::error::RELEASE_SIGNING_KEY fingerprint mismatch! Expected %s, got %s\n' "$EXPECTED_FINGERPRINT" "$ACTUAL_FP"
              rm -f priv.key
              exit 1
            fi
            printf '::notice::Production key fingerprint verified successfully: %s\n' "$ACTUAL_FP"
            KEY_FILE="priv.key"
            KEY_MODE="PRODUCTION"
          fi

          cd release-staging

          SHA_LINUX=$(sha256sum SPLogbook-Linux-x86_64.tar.gz | awk '{print $1}')
          SIZE_LINUX=$(stat -c%s SPLogbook-Linux-x86_64.tar.gz)
          SHA_WIN=$(sha256sum SPLogbook-Windows-x64.zip | awk '{print $1}')
          SIZE_WIN=$(stat -c%s SPLogbook-Windows-x64.zip)

          if [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep '^version = ' ../Cargo.toml | head -1 | cut -d'"' -f2)
          fi

          COMMIT_SHA=$(git rev-parse HEAD)
          [ ${#COMMIT_SHA} -eq 40 ] || { echo "::error::Invalid commit SHA length: ${#COMMIT_SHA}"; exit 1; }

          cat > release-manifest.json <<EOF
          {
            "manifest_version": 1,
            "key_id": "splogbook-release-2026-02",
            "product": "SPLogbook",
            "version": "$VERSION",
            "channel": "stable",
            "minimum_updater_version": "1.1.0",
            "commit": "$COMMIT_SHA",
            "assets": [
              {
                "platform": "linux",
                "arch": "x86_64",
                "package_type": "tar.gz",
                "filename": "SPLogbook-Linux-x86_64.tar.gz",
                "size": $SIZE_LINUX,
                "sha256": "$SHA_LINUX"
              },
              {
                "platform": "windows",
                "arch": "x86_64",
                "package_type": "zip",
                "filename": "SPLogbook-Windows-x64.zip",
                "size": $SIZE_WIN,
                "sha256": "$SHA_WIN"
              }
            ]
          }
          EOF

          "$SIGNER_BIN" sign "../$KEY_FILE" release-manifest.json
          [ -s release-manifest.json.sig ] || { echo "::error::Signature file was not created or is empty"; exit 1; }

          if [ "$KEY_MODE" = "PRODUCTION" ]; then
            "$SIGNER_BIN" verify release-manifest.json release-manifest.json.sig
          else
            "$SIGNER_BIN" verify release-manifest.json release-manifest.json.sig "../$KEY_FILE"
          fi

          rm -f "../$KEY_FILE" "../priv.key" "../dry_run.key" priv.key dry_run.key
          [ ! -f "../priv.key" ] || { echo "::error::priv.key still exists after cleanup!"; exit 1; }
          [ ! -f "priv.key" ] || { echo "::error::priv.key leaked into release-staging!"; exit 1; }
          [ ! -f "../dry_run.key" ] || { echo "::error::dry_run.key still exists after cleanup!"; exit 1; }
          [ ! -f "dry_run.key" ] || { echo "::error::dry_run.key leaked into release-staging!"; exit 1; }

      - name: Upload release manifest and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-and-checksums
          path: |
            release-staging/SHA256SUMS.txt
            release-staging/release-manifest.json
            release-staging/release-manifest.json.sig
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-staging/SPLogbook-Linux-x86_64.tar.gz
            release-staging/SPLogbook-Windows-x64.zip
            release-staging/SHA256SUMS.txt
            release-staging/release-manifest.json
            release-staging/release-manifest.json.sig
          generate_release_notes: true
          draft: false
          prerelease: false
