          persist-credentials: false

      - name: Download the Flatpak artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64-flatpak
          path: download/

      - name: Run every negative fixture
        env:
