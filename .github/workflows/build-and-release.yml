name: Build and Release SPLogbook

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run validation (do not publish GitHub Release)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libgtk-3-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            patchelf \
            desktop-file-utils \
            xvfb

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run unit and security tests
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable test cloud::updater
          cargo +stable test archive_
          cargo +stable test updater_install_flattens_single_root_directory_on_linux
          cargo +stable test updater_rolls_back_when_linux_rename_fails
          cargo +stable test updater_install_sets_clean_permissions_on_unix
          cargo +stable test --test security_guard
          xvfb-run --auto-servernum cargo test -- --nocapture 2>&1 | tee test_output.log || {
            ERR_MSG=$(tail -n 30 test_output.log | tr '\n' ' ')
            echo "::error file=src/lib.rs,line=1::Tests failed: $ERR_MSG"
            exit 1
          }

      - name: Compile release binary
        run: cargo build --release

      - name: Build Hamlib 4.7.2 for Linux
        run: |
          echo "Downloading and compiling Hamlib 4.7.2 for Linux release..."
          HAMLIB_VERSION="4.7.2"
          wget -q "https://github.com/Hamlib/Hamlib/releases/download/${HAMLIB_VERSION}/hamlib-${HAMLIB_VERSION}.tar.gz"
          tar -xzf "hamlib-${HAMLIB_VERSION}.tar.gz"
          cd "hamlib-${HAMLIB_VERSION}"
          ./configure \
            --prefix=/tmp/hamlib-dist \
            --disable-static \
            --enable-shared \
            --without-cxx-binding \
            --without-perl-binding \
            --without-python-binding \
            --without-tcl-binding \
            --without-lua-binding
          make -j$(nproc)
          make install
          strip /tmp/hamlib-dist/bin/* || true
          strip /tmp/hamlib-dist/lib/*.so* || true
          cd ..
          rm -rf "hamlib-${HAMLIB_VERSION}" "hamlib-${HAMLIB_VERSION}.tar.gz"

      - name: Package Linux release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          HAMLIB_DIST="/tmp/hamlib-dist" bash scripts/build_linux_portable_tar_gz.sh dist
          cp dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz SPLogbook-Linux-x86_64.tar.gz

      - name: Audit Linux ELF and Hamlib binaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit-staging
          tar -xzf dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz -C /tmp/audit-staging

          echo "=== ELF AUDIT: SPLogbook ==="
          file /tmp/audit-staging/SPLogbook/SPLogbook
          readelf -h /tmp/audit-staging/SPLogbook/SPLogbook
          readelf -l /tmp/audit-staging/SPLogbook/SPLogbook
          readelf -d /tmp/audit-staging/SPLogbook/SPLogbook
          readelf --version-info /tmp/audit-staging/SPLogbook/SPLogbook
          ldd /tmp/audit-staging/SPLogbook/SPLogbook || true

          echo "=== ELF AUDIT: splogbook-updater ==="
          file /tmp/audit-staging/SPLogbook/splogbook-updater
          readelf -h /tmp/audit-staging/SPLogbook/splogbook-updater
          readelf -l /tmp/audit-staging/SPLogbook/splogbook-updater
          readelf -d /tmp/audit-staging/SPLogbook/splogbook-updater
          readelf --version-info /tmp/audit-staging/SPLogbook/splogbook-updater
          ldd /tmp/audit-staging/SPLogbook/splogbook-updater || true

          if [ -f /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4 ]; then
            echo "=== ELF AUDIT: libhamlib.so.4 ==="
            file /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4
            readelf -h /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4
            readelf -d /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4
            readelf --version-info /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4
            ldd /tmp/audit-staging/SPLogbook/lib/libhamlib.so.4 || true
          fi
          rm -rf /tmp/audit-staging

      - name: Upload Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPLogbook-Linux-x86_64
          path: |
            dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz
            dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz.sha256
            SPLogbook-Linux-x86_64.tar.gz
          if-no-files-found: error

      # ------------------------------------------------------------------
      # STAGE-M3-G: resolve the LATEST official continuous appimagetool build
      # exactly once, verify its published SHA-256 against the local one, pin
      # it for the whole gate, and build the AppImage with that exact file.
      # The same pinned runtime is passed explicitly with --runtime-file.
      # ------------------------------------------------------------------
      - name: Resolve, verify and pin the official AppImage toolchain
        run: |
          set -euo pipefail
          bash scripts/install_appimage_toolchain.sh | tee dist/appimage-toolchain-resolve.log

      - name: Build the AppImage with the pinned continuous appimagetool
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/build_linux_appimage.sh \
            dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz \
            dist | tee dist/appimage-build.log

      - name: Smoke-verify the AppImage (structure, identity, marker)
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          APPIMAGE="dist/SPLogbook-Linux-x86_64.AppImage"
          test -s "${APPIMAGE}"
          test -x "${APPIMAGE}"
          ( cd dist && sha256sum -c SPLogbook-Linux-x86_64.AppImage.sha256 )
          MAGIC=$(od -An -tx1 -j8 -N3 "${APPIMAGE}" | tr -d ' \n')
          test "${MAGIC}" = "414902"
          file -b "${APPIMAGE}"
          WORK=$(mktemp -d)
          ( cd "${WORK}" && APPIMAGE_EXTRACT_AND_RUN=0 "${GITHUB_WORKSPACE}/${APPIMAGE}" --appimage-extract >/dev/null )
          ROOT="${WORK}/squashfs-root"
          test -x "${ROOT}/AppRun"
          test -x "${ROOT}/usr/bin/SPLogbook"
          test -x "${ROOT}/usr/bin/splogbook-updater"
          test -f "${ROOT}/usr/lib/libhamlib.so.4"
          test -f "${ROOT}/usr/share/splogbook/.splogbook-appimage-marker"
          grep -q "\"build_commit\": \"${EXPECTED_BUILD_COMMIT}\"" "${ROOT}/usr/share/splogbook/.splogbook-appimage-marker"
          grep -q '"installation_type": "LinuxAppImage"' "${ROOT}/usr/share/splogbook/.splogbook-appimage-marker"
          grep -q '"artifact_format": "AppImage"' "${ROOT}/usr/share/splogbook/.splogbook-appimage-marker"
          grep -q '"resolved_minimum_kernel": "7.0"' "${ROOT}/usr/share/splogbook/.splogbook-appimage-marker"
          grep -q '"maximum_glibc": "2.43"' "${ROOT}/usr/share/splogbook/.splogbook-appimage-marker"
          grep -q '"appimagetool_channel": "continuous"' "${ROOT}/usr/share/splogbook/.splogbook-appimage-marker"
          desktop-file-validate "${ROOT}/splogbook.desktop"
          test "$(find "${ROOT}" -type l | wc -l)" -eq 0
          test "$(find "${ROOT}/usr/lib" -maxdepth 1 -type f ! -name 'libhamlib.so.4' | wc -l)" -eq 0
          # Flatten the toolchain metadata next to the artifact so that the
          # uploaded artifact keeps a deterministic, path-stable layout.
          cp dist/appimage-toolchain/appimage-toolchain.json dist/appimage-toolchain.json
          echo "APPIMAGE SMOKE VERIFICATION PASSED"

      - name: Upload AppImage CI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPLogbook-Linux-x86_64-appimage
          path: |
            dist/SPLogbook-Linux-x86_64.AppImage
            dist/SPLogbook-Linux-x86_64.AppImage.sha256
            dist/appimage-toolchain.json
            dist/appimage-toolchain-resolve.log
          if-no-files-found: error

  # --------------------------------------------------------------------
  # STAGE-M3-H: binary DEB. Built once in the pinned Ubuntu 26.04 image
  # from the already verified portable payload. The dpkg package is
  # refreshed from the official repository of that same image. The DEB is
  # a CI artifact only and is never published in a GitHub release.
  # --------------------------------------------------------------------
  build-deb:
    name: Build DEB (Ubuntu 26.04 amd64)
    needs: build-linux
    runs-on: ubuntu-latest
    env:
      BUILD_IMAGE: "ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
      BUILD_IMAGE_DIGEST: "sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified portable payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64
          path: download/

      - name: Build the DEB with the official dpkg from the pinned image
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${BUILD_IMAGE}"
          docker pull "${IMAGE}"
          rm -rf deb_env
          mkdir -p deb_env/download deb_env/evidence dist
          cp download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz deb_env/download/
          cp download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz.sha256 deb_env/download/
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "${EXPECTED_BUILD_COMMIT}")"
          export SOURCE_DATE_EPOCH
          docker run --rm \
            -e EXPECTED_BUILD_COMMIT \
            -e SOURCE_DATE_EPOCH \
            -e BUILD_IMAGE \
            -e BUILD_IMAGE_DIGEST \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "${IMAGE}" \
            /bin/sh -c 'set -e; export DEBIAN_FRONTEND=noninteractive; apt-get update; apt-get install -y --no-install-recommends dpkg dpkg-dev ca-certificates file binutils xz-utils coreutils; dpkg --version | head -n 1 | tee dist/deb-dpkg-version.txt; dpkg-deb --version | head -n 1 | tee -a dist/deb-dpkg-version.txt; dpkg-architecture -qDEB_HOST_ARCH | tee -a dist/deb-dpkg-version.txt; bash scripts/build_linux_deb.sh dist deb_env/download/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz' \
            2>&1 | tee deb_env/evidence/deb-build.log
          test -s deb_env/evidence/deb-build.log
          grep -q "DEB BUILD COMPLETED SUCCESSFULLY" deb_env/evidence/deb-build.log
          test -s dist/SPLogbook-Linux-amd64-1.3.0-alpha.1.deb
          ( cd dist && sha256sum -c SPLogbook-Linux-amd64-1.3.0-alpha.1.deb.sha256 )
          ( cd dist && sha256sum -c SPLogbook-Linux-amd64.deb.sha256 )
          mkdir -p deb_artifact
          cp dist/SPLogbook-Linux-amd64-1.3.0-alpha.1.deb deb_artifact/
          cp dist/SPLogbook-Linux-amd64-1.3.0-alpha.1.deb.sha256 deb_artifact/
          cp dist/SPLogbook-Linux-amd64.deb deb_artifact/
          cp dist/SPLogbook-Linux-amd64.deb.sha256 deb_artifact/
          cp dist/deb-toolchain.json deb_artifact/
          cp dist/deb-info.txt deb_artifact/
          cp dist/deb-contents.txt deb_artifact/
          cp dist/deb-fields.txt deb_artifact/
          cp dist/deb-dpkg-version.txt deb_artifact/
          cp deb_env/evidence/deb-build.log deb_artifact/

      - name: Upload the DEB CI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPLogbook-Linux-amd64-deb
          path: deb_artifact/*
          if-no-files-found: error

  # --------------------------------------------------------------------
  # STAGE-M3-I: binary RPM. Built once in the pinned Fedora 45 image from
  # the already verified portable payload. The RPM is a CI artifact only
  # and is never published in a GitHub release.
  # --------------------------------------------------------------------
  build-rpm:
    name: Build RPM (Fedora 45 x86_64)
    needs: build-linux
    runs-on: ubuntu-latest
    env:
      BUILD_IMAGE: "fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c"
      BUILD_IMAGE_DIGEST: "sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified portable payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64
          path: download/

      - name: Build the RPM with the official rpmbuild from the pinned image
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${BUILD_IMAGE}"
          docker pull "${IMAGE}"
          rm -rf rpm_env
          mkdir -p rpm_env/download rpm_env/evidence dist
          cp download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz rpm_env/download/
          cp download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz.sha256 rpm_env/download/
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "${EXPECTED_BUILD_COMMIT}")"
          export SOURCE_DATE_EPOCH
          docker run --rm \
            -e EXPECTED_BUILD_COMMIT \
            -e SOURCE_DATE_EPOCH \
            -e BUILD_IMAGE \
            -e BUILD_IMAGE_DIGEST \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "${IMAGE}" \
            /bin/sh -c 'set -e; dnf install -y --setopt=install_weak_deps=False rpm rpm-build rpmdevtools rpmlint cpio patchelf file binutils gzip tar xz findutils coreutils bash; rpm --version | tee dist/rpm-dnf-version.txt; rpmbuild --version | tee -a dist/rpm-dnf-version.txt; rpmspec --version | tee -a dist/rpm-dnf-version.txt; rpmlint --version 2>&1 | head -n 1 | tee -a dist/rpm-dnf-version.txt; bash scripts/build_linux_rpm.sh dist rpm_env/download/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz' \
            2>&1 | tee rpm_env/evidence/rpm-build.log
          test -s rpm_env/evidence/rpm-build.log
          grep -q "RPM BUILD COMPLETED SUCCESSFULLY" rpm_env/evidence/rpm-build.log
          test -s dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm
          ( cd dist && sha256sum -c SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm.sha256 )
          ( cd dist && sha256sum -c SPLogbook-Linux-x86_64.rpm.sha256 )
          mkdir -p rpm_artifact
          cp dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm rpm_artifact/
          cp dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm.sha256 rpm_artifact/
          cp dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm.manifest rpm_artifact/
          cp dist/SPLogbook-Linux-x86_64.rpm rpm_artifact/
          cp dist/SPLogbook-Linux-x86_64.rpm.sha256 rpm_artifact/
          cp dist/rpm-toolchain.json rpm_artifact/
          cp dist/rpm-info.txt rpm_artifact/
          cp dist/rpm-contents.txt rpm_artifact/
          cp dist/rpm-fields.txt rpm_artifact/
          cp dist/rpm-scripts.txt rpm_artifact/
          cp dist/rpm-requires.txt rpm_artifact/
          cp dist/rpm-dnf-version.txt rpm_artifact/
          cp rpm_env/evidence/rpm-build.log rpm_artifact/

      - name: Upload the RPM CI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPLogbook-Linux-x86_64-rpm
          path: rpm_artifact/*
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run unit and security tests
        shell: pwsh
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable check --workspace --all-targets --all-features
          cargo +stable test cloud::updater
          cargo +stable test windows_production_zip_path
          cargo +stable test updater_uses_zip_extension_for_windows_archive
          cargo +stable test updater_rolls_back_when_windows_replace_fails
          cargo +stable test updater_install_flattens_single_root_directory_and_uses_zip_on_windows
          cargo +stable test --test security_guard
          cargo test --verbose

      - name: Compile release binary
        run: cargo build --release

      - name: Package Windows release archive
        shell: pwsh
        run: |
          $pkgDir = "SPLogbook-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$pkgDir\databases" | Out-Null
          Copy-Item target\release\SPLogbook.exe "$pkgDir\"
          Copy-Item assets\icon.ico "$pkgDir\"
          Copy-Item databases\serviceLOG.db "$pkgDir\databases\"
          if (Test-Path databases\callbook.db) { Copy-Item databases\callbook.db "$pkgDir\databases\" }
          Copy-Item README.md "$pkgDir\"
          Copy-Item LICENSE "$pkgDir\"

          # Download and bundle pre-built Hamlib 4.7.2 binaries (rigctld, rotctld, and DLLs)
          Write-Host "Downloading Hamlib 4.7.2 for Windows..."
          $hamlibZip = "hamlib-w64-4.7.2.zip"
          $hamlibUrl = "https://github.com/Hamlib/Hamlib/releases/download/4.7.2/$hamlibZip"
          Invoke-WebRequest -Uri $hamlibUrl -OutFile $hamlibZip
          Expand-Archive -Path $hamlibZip -DestinationPath "hamlib-tmp" -Force
          Copy-Item "hamlib-tmp\hamlib-w64-4.7.2\bin\*" "$pkgDir\" -Force
          New-Item -ItemType Directory -Force -Path "$pkgDir\hamlib" | Out-Null
          Copy-Item "hamlib-tmp\hamlib-w64-4.7.2" "$pkgDir\hamlib\" -Recurse -Force
          Remove-Item -Recurse -Force "hamlib-tmp", $hamlibZip

          Compress-Archive -Path "$pkgDir\*" -DestinationPath "SPLogbook-Windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPLogbook-Windows-x64
          path: SPLogbook-Windows-x64.zip
          if-no-files-found: error

  verify-linux-matrix:
    name: Verify Linux (${{ matrix.name }})
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # OWNER-M3-F-KERNEL-POLICY-OPTION-A / OWNER-M3-F-GLIBC-POLICY-01
        # Supported runtime matrix: Linux >= 7.0 and glibc >= 2.43.
        # Debian 13.7 (glibc 2.41) and openSUSE Leap 16.1 (glibc 2.40) are NOT
        # supported; Ubuntu 26.10 is an interim release outside the LTS scope.
        include:
          - name: "Ubuntu 26.04.1 LTS Resolute Raccoon"
            distro_id: "ubuntu-lts"
            image: "ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
            pkg_query: "dpkg-query -W linux-image-generic libc6"
          - name: "Fedora Linux 45 Final/GA"
            distro_id: "fedora-final"
            image: "fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c"
            pkg_query: "rpm -q kernel glibc libgcc libstdc++"
          - name: "Arch Linux Rolling Snapshot"
            distro_id: "arch-rolling"
            image: "archlinux:base-20261101.0.620205@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9"
            pkg_query: "pacman -Q glibc; pacman-conf --repo-list"
          - name: "openSUSE Tumbleweed"
            distro_id: "opensuse-tumbleweed"
            image: "opensuse/tumbleweed:latest@sha256:6e3a892daa0372e12a9c0b10291303dbfcd8706a450de6edfd72c763b44b4ac1"
            pkg_query: "rpm -q kernel-default glibc; zypper lr -u"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Linux release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64
          path: download/

      - name: Verify immutable SHA-256 and execute fail-closed multi-distribution native validation
        run: |
          set -euo pipefail
          echo "=== PULLING PINNED OCI IMAGE ==="
          docker pull "${{ matrix.image }}"

          CANONICAL_SHA=$(awk '{print $1}' download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz.sha256)
          echo "Canonical SHA-256: ${CANONICAL_SHA}"

          mkdir -p test_env/evidence
          cp download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz test_env/
          cp download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz.sha256 test_env/
          cp scripts/verify_linux_container.sh test_env/run_test.sh
          cp scripts/install_linux_runtime_deps.sh test_env/install_runtime_deps.sh
          chmod +x test_env/run_test.sh test_env/install_runtime_deps.sh

          # Runtime libraries are installed first (fail-closed); only then the
          # native verifier runs. `set -euo pipefail` on the runner plus the
          # pipefail-aware pipeline propagate any container failure to the job.
          docker run --rm \
            -e PKG_QUERY_CMD="${{ matrix.pkg_query }}" \
            -e EXPECTED_BUILD_COMMIT="${{ github.sha }}" \
            -v "$(pwd)/test_env:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            /bin/sh -c 'set -e; /bin/sh /workspace/install_runtime_deps.sh; exec /bin/sh /workspace/run_test.sh' \
            2>&1 | tee "test_env/evidence/native-evidence-${{ matrix.distro_id }}.log"

          EVIDENCE="test_env/evidence/native-evidence-${{ matrix.distro_id }}.log"
          test -s "${EVIDENCE}"
          grep -q "PASS: ldd resolved every direct dependency" "${EVIDENCE}"
          grep -q "PASS: --version executed" "${EVIDENCE}"
          grep -q "PASS: --build-info executed" "${EVIDENCE}"
          grep -q "PASS: GLIBC policy satisfied" "${EVIDENCE}"
          grep -q "NATIVE VERIFICATION COMPLETED SUCCESSFULLY" "${EVIDENCE}"

      - name: Upload native evidence log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-${{ matrix.distro_id }}
          path: test_env/evidence/native-evidence-${{ matrix.distro_id }}.log
          if-no-files-found: error

      # ------------------------------------------------------------------
      # STAGE-M3-G: every supported profile verifies the SAME AppImage that was
      # built once in build-linux. No profile rebuilds the image.
      # ------------------------------------------------------------------
      - name: Download AppImage CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64-appimage
          path: appimage/

      - name: Verify the same AppImage in the ${{ matrix.distro_id }} profile
        run: |
          set -euo pipefail
          APPIMAGE="appimage/SPLogbook-Linux-x86_64.AppImage"
          test -s "${APPIMAGE}"
          TOOLCHAIN_JSON=$(find appimage -name appimage-toolchain.json -print -quit)
          test -n "${TOOLCHAIN_JSON}"
          python3 - "${TOOLCHAIN_JSON}" <<'PY' > appimage-env.sh
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          tool = data["appimagetool"]
          runtime = data["runtime"]
          print(f"export EXPECTED_APPIMAGETOOL_SHA256='{tool['published_sha256']}'")
          print(f"export EXPECTED_APPIMAGETOOL_COMMIT='{tool['source_commit']}'")
          print(f"export EXPECTED_RUNTIME_SHA256='{runtime['published_sha256']}'")
          print(f"export EXPECTED_RUNTIME_COMMIT='{runtime['source_commit']}'")
          PY
          # shellcheck disable=SC1091
          . ./appimage-env.sh
          EXPECTED_DESKTOP_SHA256=$(sha256sum installer/linux/portable/templates/splogbook.desktop | awk '{print $1}')
          EXPECTED_ICON_SHA256=$(sha256sum assets/icon.png | awk '{print $1}')
          export EXPECTED_DESKTOP_SHA256 EXPECTED_ICON_SHA256

          rm -rf appimage_env
          mkdir -p appimage_env/evidence
          cp "${APPIMAGE}" appimage_env/
          cp appimage/SPLogbook-Linux-x86_64.AppImage.sha256 appimage_env/
          # Artifact archives do not preserve POSIX modes: restore 0755 explicitly.
          chmod 0755 appimage_env/SPLogbook-Linux-x86_64.AppImage
          cp scripts/verify_appimage.sh appimage_env/
          cp scripts/install_linux_runtime_deps.sh appimage_env/
          chmod +x appimage_env/verify_appimage.sh appimage_env/install_linux_runtime_deps.sh

          docker run --rm \
            -e EXPECTED_BUILD_COMMIT="${{ github.sha }}" \
            -e EXPECTED_DESKTOP_SHA256="${EXPECTED_DESKTOP_SHA256}" \
            -e EXPECTED_ICON_SHA256="${EXPECTED_ICON_SHA256}" \
            -e EXPECTED_APPIMAGETOOL_SHA256="${EXPECTED_APPIMAGETOOL_SHA256}" \
            -e EXPECTED_APPIMAGETOOL_COMMIT="${EXPECTED_APPIMAGETOOL_COMMIT}" \
            -e EXPECTED_RUNTIME_SHA256="${EXPECTED_RUNTIME_SHA256}" \
            -e EXPECTED_RUNTIME_COMMIT="${EXPECTED_RUNTIME_COMMIT}" \
            -v "$(pwd)/appimage_env:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            /bin/sh -c 'set -e; /bin/sh /workspace/install_linux_runtime_deps.sh; exec /bin/sh /workspace/verify_appimage.sh' \
            2>&1 | tee "appimage_env/evidence/appimage-evidence-${{ matrix.distro_id }}.log"

          EVIDENCE="appimage_env/evidence/appimage-evidence-${{ matrix.distro_id }}.log"
          test -s "${EVIDENCE}"
          grep -q "APPIMAGE VERIFICATION COMPLETED SUCCESSFULLY" "${EVIDENCE}"
          grep -q "PASS: --version and --build-info" "${EVIDENCE}"
          grep -q "PASS: GLIBC policy satisfied" "${EVIDENCE}"
          grep -q "PASS: AppImage marker verified" "${EVIDENCE}"
          grep -q "PASS: desktop files are byte-identical" "${EVIDENCE}"
          grep -q "PASS: XDG isolation, health check and AppDir immutability verified" "${EVIDENCE}"

      - name: Upload AppImage native evidence log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-evidence-${{ matrix.distro_id }}
          path: appimage_env/evidence/appimage-evidence-${{ matrix.distro_id }}.log
          if-no-files-found: error

  verify-linux-negative:
    name: Verify Linux (negative fixture, fail-closed proof)
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Linux release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64
          path: download/

      # Deliberately run the fail-closed verifier inside a bare, pinned Ubuntu
      # image WITHOUT the runtime libraries. The real artifact must fail: this
      # proves that a missing shared library cannot be reported as success.
      - name: Prove missing runtime library fails closed
        run: |
          set -euo pipefail
          IMAGE="ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
          docker pull "${IMAGE}"

          rm -rf negative_fixture
          mkdir -p negative_fixture/evidence
          cp download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz negative_fixture/
          cp download/dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.tar.gz.sha256 negative_fixture/
          cp scripts/verify_linux_container.sh negative_fixture/run_test.sh
          chmod +x negative_fixture/run_test.sh

          set +e
          docker run --rm \
            -e EXPECTED_BUILD_COMMIT="${{ github.sha }}" \
            -v "$(pwd)/negative_fixture:/workspace" \
            -w /workspace \
            "${IMAGE}" \
            /bin/sh -c 'set -e; apt-get update >/dev/null 2>&1; apt-get install -y --no-install-recommends file binutils >/dev/null 2>&1; exec /bin/sh /workspace/run_test.sh' \
            > negative_fixture/evidence/negative-fixture.log 2>&1
          NEGATIVE_CODE=$?
          set -e

          cat negative_fixture/evidence/negative-fixture.log
          echo "Negative fixture exit code: ${NEGATIVE_CODE}"

          if [ "${NEGATIVE_CODE}" -eq 0 ]; then
            echo "::error::fail-closed negative fixture unexpectedly succeeded"
            exit 1
          fi
          if grep -q "NATIVE VERIFICATION COMPLETED SUCCESSFULLY" negative_fixture/evidence/negative-fixture.log; then
            echo "::error::success message was emitted despite the missing runtime library"
            exit 1
          fi
          if ! grep -q "not found" negative_fixture/evidence/negative-fixture.log; then
            echo "::error::expected 'not found' ldd evidence is missing from the negative fixture log"
            exit 1
          fi
          echo "Negative fixture proved fail-closed behavior: missing runtime library => non-zero, no success message."

      - name: Upload negative fixture evidence log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-negative-fixture
          path: negative_fixture/evidence/negative-fixture.log
          if-no-files-found: error

  # --------------------------------------------------------------------
  # STAGE-M3-G: negative fixtures. The job succeeds ONLY because every
  # mutated AppImage / AppDir was rejected with a non-zero exit code and
  # without the success message.
  # --------------------------------------------------------------------
  verify-appimage-negative-fixtures:
    name: Verify AppImage (negative fixtures, fail-closed proof)
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download AppImage CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64-appimage
          path: appimage/

      - name: Prove that every mutated AppImage fixture fails closed
        run: |
          set -euo pipefail
          IMAGE="ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
          docker pull "${IMAGE}"

          TOOLCHAIN_JSON=$(find appimage -name appimage-toolchain.json -print -quit)
          test -n "${TOOLCHAIN_JSON}"
          python3 - "${TOOLCHAIN_JSON}" <<'PY' > appimage-env.sh
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          tool = data["appimagetool"]
          runtime = data["runtime"]
          print(f"export EXPECTED_APPIMAGETOOL_SHA256='{tool['published_sha256']}'")
          print(f"export EXPECTED_APPIMAGETOOL_COMMIT='{tool['source_commit']}'")
          print(f"export EXPECTED_RUNTIME_SHA256='{runtime['published_sha256']}'")
          print(f"export EXPECTED_RUNTIME_COMMIT='{runtime['source_commit']}'")
          PY
          # shellcheck disable=SC1091
          . ./appimage-env.sh
          EXPECTED_DESKTOP_SHA256=$(sha256sum installer/linux/portable/templates/splogbook.desktop | awk '{print $1}')
          EXPECTED_ICON_SHA256=$(sha256sum assets/icon.png | awk '{print $1}')
          export EXPECTED_DESKTOP_SHA256 EXPECTED_ICON_SHA256

          rm -rf negative_env
          mkdir -p negative_env/evidence
          cp appimage/SPLogbook-Linux-x86_64.AppImage negative_env/
          cp appimage/SPLogbook-Linux-x86_64.AppImage.sha256 negative_env/
          # Artifact archives do not preserve POSIX modes: restore 0755 explicitly.
          chmod 0755 negative_env/SPLogbook-Linux-x86_64.AppImage
          cp scripts/verify_appimage.sh negative_env/
          cp scripts/verify_appimage_negative_fixture.sh negative_env/
          cp scripts/install_linux_runtime_deps.sh negative_env/
          chmod +x negative_env/verify_appimage.sh negative_env/verify_appimage_negative_fixture.sh negative_env/install_linux_runtime_deps.sh

          docker run --rm \
            -e EXPECTED_BUILD_COMMIT="${{ github.sha }}" \
            -e EXPECTED_DESKTOP_SHA256="${EXPECTED_DESKTOP_SHA256}" \
            -e EXPECTED_ICON_SHA256="${EXPECTED_ICON_SHA256}" \
            -e EXPECTED_APPIMAGETOOL_SHA256="${EXPECTED_APPIMAGETOOL_SHA256}" \
            -e EXPECTED_APPIMAGETOOL_COMMIT="${EXPECTED_APPIMAGETOOL_COMMIT}" \
            -e EXPECTED_RUNTIME_SHA256="${EXPECTED_RUNTIME_SHA256}" \
            -e EXPECTED_RUNTIME_COMMIT="${EXPECTED_RUNTIME_COMMIT}" \
            -v "$(pwd)/negative_env:/workspace" \
            -w /workspace \
            "${IMAGE}" \
            /bin/sh -c 'set -e; /bin/sh /workspace/install_linux_runtime_deps.sh; exec /bin/sh /workspace/verify_appimage_negative_fixture.sh' \
            2>&1 | tee negative_env/evidence/negative-fixtures.log

          grep -q "NEGATIVE FIXTURES REJECTED AS EXPECTED: 12/12" negative_env/evidence/negative-fixtures.log
          if grep -q "APPIMAGE VERIFICATION COMPLETED SUCCESSFULLY" negative_env/evidence/negative-fixtures.log; then
            echo "::error::the success message leaked into the negative fixture evidence"
            exit 1
          fi

      - name: Upload negative fixture evidence log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-evidence-negative-fixtures
          path: negative_env/evidence/negative-fixtures.log
          if-no-files-found: error

  # --------------------------------------------------------------------
  # STAGE-M3-G: real FUSE runtime evidence. Extraction is NOT FUSE.
  # When /dev/fuse is present the mount MUST succeed; when the runner
  # genuinely has no /dev/fuse the status is recorded as UNAVAILABLE and
  # is never reported as PASS.
  # --------------------------------------------------------------------
  verify-appimage-fuse:
    name: Verify AppImage (real FUSE mount evidence)
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download AppImage CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64-appimage
          path: appimage/

      - name: Execute the AppImage through a real FUSE mount
        run: |
          set -euo pipefail
          cp appimage/SPLogbook-Linux-x86_64.AppImage .
          cp appimage/SPLogbook-Linux-x86_64.AppImage.sha256 .
          chmod +x SPLogbook-Linux-x86_64.AppImage
          sha256sum -c SPLogbook-Linux-x86_64.AppImage.sha256
          BEFORE_SHA=$(sha256sum SPLogbook-Linux-x86_64.AppImage | awk '{print $1}')

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            file binutils coreutils desktop-file-utils \
            libasound2t64 libx11-6 libxcursor1 libxrandr2 libxi6 libxkbcommon0 \
            libxkbcommon-x11-0 libgl1 libfontconfig1 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libgtk-3-0t64 libusb-1.0-0 libudev1
          # FUSE userspace libraries: package names differ between runner images.
          sudo apt-get install -y --no-install-recommends libfuse2t64 fuse3 \
            || sudo apt-get install -y --no-install-recommends libfuse2 fuse3

          if [ ! -e /dev/fuse ]; then
            echo "FUSE_STATUS=UNAVAILABLE_IN_CI"
            echo "FUSE_RUNTIME_VERIFIED=false"
            echo "::notice::/dev/fuse is not available on this runner; real FUSE evidence is classified as unavailable, never as PASS"
            exit 0
          fi
          echo "FUSE_DEVICE_PRESENT=true"

          ./SPLogbook-Linux-x86_64.AppImage --version | tee fuse-version.txt
          test "$(cat fuse-version.txt)" = "SPLogbook 1.3.0-alpha.1"
          ./SPLogbook-Linux-x86_64.AppImage --build-info | tee fuse-build-info.txt
          grep -q "^Commit: ${{ github.sha }}$" fuse-build-info.txt
          HEALTH_PROOF=$(mktemp)
          ./SPLogbook-Linux-x86_64.AppImage --check-health-startup --health-proof-path "${HEALTH_PROOF}"
          test -s "${HEALTH_PROOF}"
          sha256sum -c SPLogbook-Linux-x86_64.AppImage.sha256
          AFTER_SHA=$(sha256sum SPLogbook-Linux-x86_64.AppImage | awk '{print $1}')
          test "${BEFORE_SHA}" = "${AFTER_SHA}"
          echo "FUSE_STATUS=VERIFIED"
          echo "FUSE_RUNTIME_VERIFIED=true"
          echo "REAL FUSE MOUNT EXECUTION VERIFIED"

      - name: Upload FUSE evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-evidence-fuse
          path: |
            fuse-version.txt
            fuse-build-info.txt
          if-no-files-found: warn

  # --------------------------------------------------------------------
  # STAGE-M3-H: native DEB verification. The package is installed, upgraded,
  # downgraded, reinstalled, removed and purged in a disposable pinned
  # Ubuntu 26.04 container. User data lives in an isolated temporary HOME.
  # --------------------------------------------------------------------
  verify-deb:
    name: Verify DEB (Ubuntu 26.04 LTS native)
    needs: build-deb
    runs-on: ubuntu-latest
    env:
      BUILD_IMAGE: "ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the DEB CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-amd64-deb
          path: deb/

      - name: Verify the DEB natively in the pinned Ubuntu 26.04 image
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${BUILD_IMAGE}"
          docker pull "${IMAGE}"
          EXPECTED_ICON_SHA256="$(sha256sum assets/icon.png | awk '{print $1}')"
          EXPECTED_DESKTOP_SHA256="$(sha256sum installer/linux/deb/splogbook.desktop | awk '{print $1}')"
          export EXPECTED_ICON_SHA256 EXPECTED_DESKTOP_SHA256
          rm -rf deb_verify
          mkdir -p deb_verify/evidence
          cp deb/SPLogbook-Linux-amd64-1.3.0-alpha.1.deb deb_verify/
          cp deb/SPLogbook-Linux-amd64-1.3.0-alpha.1.deb.sha256 deb_verify/
          docker run --rm \
            -e EXPECTED_BUILD_COMMIT \
            -e EXPECTED_ICON_SHA256 \
            -e EXPECTED_DESKTOP_SHA256 \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "${IMAGE}" \
            /bin/sh -c 'set -e; export DEBIAN_FRONTEND=noninteractive; apt-get update; apt-get install -y --no-install-recommends dpkg apt-utils lintian desktop-file-utils file binutils python3 ca-certificates; sh scripts/verify_linux_deb.sh deb_verify/SPLogbook-Linux-amd64-1.3.0-alpha.1.deb' \
            2>&1 | tee deb_verify/evidence/deb-verify.log
          test -s deb_verify/evidence/deb-verify.log
          grep -q "DEB VERIFICATION COMPLETED SUCCESSFULLY" deb_verify/evidence/deb-verify.log
          grep -q "PASS: user data unchanged after: final purge" deb_verify/evidence/deb-verify.log
          grep -q "PASS: lintian reported 0 errors" deb_verify/evidence/deb-verify.log
          grep -q "PASS: GLIBC policy satisfied" deb_verify/evidence/deb-verify.log

      - name: Upload DEB verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-evidence-verify
          path: deb_verify/evidence/deb-verify.log
          if-no-files-found: error

  # --------------------------------------------------------------------
  # STAGE-M3-H: negative DEB fixtures. The job succeeds ONLY because every
  # mutated package was rejected with a non-zero verifier exit code and
  # without any success message.
  # --------------------------------------------------------------------
  verify-deb-negative-fixtures:
    name: Verify DEB (negative fixtures, fail-closed proof)
    needs: build-deb
    runs-on: ubuntu-latest
    env:
      BUILD_IMAGE: "ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the DEB CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-amd64-deb
          path: deb/

      - name: Prove that every mutated DEB fixture fails closed
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${BUILD_IMAGE}"
          docker pull "${IMAGE}"
          EXPECTED_ICON_SHA256="$(sha256sum assets/icon.png | awk '{print $1}')"
          EXPECTED_DESKTOP_SHA256="$(sha256sum installer/linux/deb/splogbook.desktop | awk '{print $1}')"
          export EXPECTED_ICON_SHA256 EXPECTED_DESKTOP_SHA256
          rm -rf deb_negative
          mkdir -p deb_negative/evidence
          cp deb/SPLogbook-Linux-amd64-1.3.0-alpha.1.deb deb_negative/
          cp deb/SPLogbook-Linux-amd64-1.3.0-alpha.1.deb.sha256 deb_negative/
          docker run --rm \
            -e EXPECTED_BUILD_COMMIT \
            -e EXPECTED_ICON_SHA256 \
            -e EXPECTED_DESKTOP_SHA256 \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "${IMAGE}" \
            /bin/sh -c 'set -e; export DEBIAN_FRONTEND=noninteractive; apt-get update; apt-get install -y --no-install-recommends dpkg apt-utils desktop-file-utils file binutils python3 ca-certificates; sh scripts/verify_linux_deb_negative_fixture.sh scripts/verify_linux_deb.sh deb_negative/SPLogbook-Linux-amd64-1.3.0-alpha.1.deb' \
            2>&1 | tee deb_negative/evidence/deb-negative-fixtures.log
          test -s deb_negative/evidence/deb-negative-fixtures.log
          grep -q "NEGATIVE FIXTURES REJECTED AS EXPECTED: 27/27" deb_negative/evidence/deb-negative-fixtures.log
          if grep -q "COMPLETED SUCCESSFULLY" deb_negative/evidence/deb-negative-fixtures.log; then
            echo "::error::the success message leaked into the negative fixture evidence"
            exit 1
          fi

      - name: Upload DEB negative fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-evidence-negative-fixtures
          path: deb_negative/evidence/deb-negative-fixtures.log
          if-no-files-found: error

  # --------------------------------------------------------------------
  # STAGE-M3-I: native RPM verification. The same Fedora-built RPM is
  # installed, upgraded, downgraded, reinstalled and erased in Fedora 45
  # (native reference) and openSUSE Tumbleweed (compatibility profile).
  # User data lives in an isolated temporary HOME.
  # --------------------------------------------------------------------
  verify-rpm:
    name: Verify RPM (${{ matrix.name }})
    needs: build-rpm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Fedora Linux 45 (native reference)"
            rpm_profile: "fedora-45"
            rpm_oci: "fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c"
            install_tools: ""
            skip_rpmlint: "0"
          - name: "openSUSE Tumbleweed (compatibility)"
            rpm_profile: "opensuse-tumbleweed"
            rpm_oci: "opensuse/tumbleweed:latest@sha256:6e3a892daa0372e12a9c0b10291303dbfcd8706a450de6edfd72c763b44b4ac1"
            install_tools: "zypper --non-interactive --gpg-auto-import-keys refresh; zypper --non-interactive install --no-recommends --auto-agree-with-licenses rpm rpm-build rpmlint cpio file binutils desktop-file-utils findutils python3 ca-certificates"
            skip_rpmlint: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the RPM CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64-rpm
          path: rpm/

      - name: Verify the RPM natively in the pinned ${{ matrix.name }} image
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
          SKIP_RPMLINT: ${{ matrix.skip_rpmlint }}
        run: |
          set -euo pipefail
          IMAGE="${{ matrix.rpm_oci }}"
          docker pull "${IMAGE}"
          EXPECTED_ICON_SHA256="$(sha256sum assets/icon.png | awk '{print $1}')"
          EXPECTED_DESKTOP_SHA256="$(sha256sum installer/linux/rpm/splogbook.desktop | awk '{print $1}')"
          EXPECTED_SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "${EXPECTED_BUILD_COMMIT}")"
          export EXPECTED_ICON_SHA256 EXPECTED_DESKTOP_SHA256 EXPECTED_SOURCE_DATE_EPOCH
          rm -rf rpm_verify
          mkdir -p rpm_verify/evidence
          cp rpm/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm rpm_verify/
          cp rpm/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm.sha256 rpm_verify/
          cp rpm/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm.manifest rpm_verify/
          docker run --rm \
            -e EXPECTED_BUILD_COMMIT \
            -e EXPECTED_ICON_SHA256 \
            -e EXPECTED_DESKTOP_SHA256 \
            -e EXPECTED_SOURCE_DATE_EPOCH \
            -e SKIP_RPMLINT \
            -e INSTALL_TOOLS="${{ matrix.install_tools }}" \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "${IMAGE}" \
            /bin/sh -c 'set -e; if [ -n "${INSTALL_TOOLS}" ]; then eval "${INSTALL_TOOLS}"; elif command -v dnf >/dev/null 2>&1; then dnf install -y --setopt=install_weak_deps=False rpm rpm-build rpmdevtools rpmlint cpio file binutils desktop-file-utils findutils python3 ca-certificates; else echo "no supported package manager" >&2; exit 1; fi; sh scripts/install_linux_runtime_deps.sh; SPLOG_RPM_SKIP_RPMLINT="${SKIP_RPMLINT}" sh scripts/verify_linux_rpm.sh rpm_verify/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm' \
            2>&1 | tee "rpm_verify/evidence/rpm-verify-${GITHUB_JOB}-${{ matrix.rpm_profile }}.log"
          EVIDENCE="rpm_verify/evidence/rpm-verify-${GITHUB_JOB}-${{ matrix.rpm_profile }}.log"
          test -s "${EVIDENCE}"
          grep -q "RPM VERIFICATION COMPLETED SUCCESSFULLY" "${EVIDENCE}"
          grep -q "PASS: user data unchanged after: final remove and full erase" "${EVIDENCE}"
          grep -q "PASS: GLIBC policy satisfied" "${EVIDENCE}"
          grep -q "PASS: ldd resolves every shared library" "${EVIDENCE}"
          if [ "${{ matrix.skip_rpmlint }}" = "0" ]; then
            grep -q "PASS: rpmlint reported 0 errors" "${EVIDENCE}"
          fi

      - name: Upload RPM verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-evidence-verify-${{ matrix.rpm_profile }}
          path: rpm_verify/evidence/*.log
          if-no-files-found: error

  # --------------------------------------------------------------------
  # STAGE-M3-I: negative RPM fixtures. The job succeeds ONLY because every
  # mutated package was rejected with a non-zero verifier exit code and
  # without any success message.
  # --------------------------------------------------------------------
  verify-rpm-negative-fixtures:
    name: Verify RPM (negative fixtures, fail-closed proof)
    needs: build-rpm
    runs-on: ubuntu-latest
    env:
      BUILD_IMAGE: "fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the RPM CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64-rpm
          path: rpm/

      - name: Prove that every mutated RPM fixture fails closed
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${BUILD_IMAGE}"
          docker pull "${IMAGE}"
          EXPECTED_ICON_SHA256="$(sha256sum assets/icon.png | awk '{print $1}')"
          EXPECTED_DESKTOP_SHA256="$(sha256sum installer/linux/rpm/splogbook.desktop | awk '{print $1}')"
          export EXPECTED_ICON_SHA256 EXPECTED_DESKTOP_SHA256
          rm -rf rpm_negative
          mkdir -p rpm_negative/evidence
          cp rpm/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm rpm_negative/
          cp rpm/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm.sha256 rpm_negative/
          cp rpm/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm.manifest rpm_negative/
          docker run --rm \
            -e EXPECTED_BUILD_COMMIT \
            -e EXPECTED_ICON_SHA256 \
            -e EXPECTED_DESKTOP_SHA256 \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "${IMAGE}" \
            /bin/sh -c 'set -e; dnf install -y --setopt=install_weak_deps=False rpm rpm-build rpmdevtools rpmlint cpio file binutils desktop-file-utils findutils python3 patchelf ca-certificates; sh scripts/install_linux_runtime_deps.sh; sh scripts/verify_linux_rpm_negative_fixture.sh scripts/verify_linux_rpm.sh rpm_negative/SPLogbook-Linux-x86_64-1.3.0-alpha.1.rpm' \
            2>&1 | tee rpm_negative/evidence/rpm-negative-fixtures.log
          test -s rpm_negative/evidence/rpm-negative-fixtures.log
          grep -q "NEGATIVE FIXTURES REJECTED AS EXPECTED: 34/34" rpm_negative/evidence/rpm-negative-fixtures.log
          if grep -q "COMPLETED SUCCESSFULLY" rpm_negative/evidence/rpm-negative-fixtures.log; then
            echo "::error::the success message leaked into the negative fixture evidence"
            exit 1
          fi

      - name: Upload RPM negative fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-evidence-negative-fixtures
          path: rpm_negative/evidence/rpm-negative-fixtures.log
          if-no-files-found: error

  # --------------------------------------------------------------------
  # STAGE-M3-J: SPLogbook Flatpak (io.github.sp6ina.SPLogbook).
  #
  # The bundle is produced from the pinned org.freedesktop runtime 26.08 and
  # the 662 SHA-256 pinned crates of Cargo.lock, inside a privileged container
  # (bubblewrap needs user namespaces). Sources are downloaded once with
  # --download-only; the real build runs with --disable-download and
  # cargo --locked --offline. The bundle is a CI artifact only: it is never
  # uploaded to a GitHub release and never submitted to Flathub.
  # --------------------------------------------------------------------
  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    env:
      FLATPAK_BUILD_IMAGE: "ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
      FLATPAK_BUILD_IMAGE_DIGEST: "sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the Flatpak in the pinned privileged container
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${FLATPAK_BUILD_IMAGE}"
          docker pull "${IMAGE}"
          docker run --rm --privileged \
            -e EXPECTED_BUILD_COMMIT \
            -e FLATPAK_BUILD_IMAGE \
            -e FLATPAK_BUILD_IMAGE_DIGEST \
            -e SPLOG_FLATPAK_BUILDS=1 \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "${IMAGE}" \
            /bin/bash -c 'set -euo pipefail; export DEBIAN_FRONTEND=noninteractive; apt-get update; apt-get install -y --no-install-recommends flatpak flatpak-builder ostree appstream desktop-file-utils xvfb xauth python3 file binutils git ca-certificates; bash -n scripts/build_linux_flatpak.sh; bash -n scripts/verify_linux_flatpak.sh; bash -n scripts/verify_linux_flatpak_negative_fixture.sh; bash scripts/build_linux_flatpak.sh dist' \
            2>&1 | tee flatpak-build.log
          test -s flatpak-build.log
          grep -q "FLATPAK BUILD COMPLETED SUCCESSFULLY" flatpak-build.log
          test -s dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.flatpak
          ( cd dist && sha256sum -c SPLogbook-Linux-x86_64-1.3.0-alpha.1.flatpak.sha256 )
          ( cd dist && sha256sum -c SPLogbook-Linux-x86_64.flatpak.sha256 )

      - name: Upload the Flatpak CI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPLogbook-Linux-x86_64-flatpak
          path: |
            dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.flatpak
            dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.flatpak.sha256
            dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.flatpak.manifest
            dist/SPLogbook-Linux-x86_64.flatpak
            dist/SPLogbook-Linux-x86_64.flatpak.sha256
            dist/flatpak-toolchain.json
            dist/flatpak-determinism.txt
            dist/flatpak-manifest.projection.txt
            dist/flatpak-runtime-info.txt
            dist/flatpak-sdk-info.txt
            dist/flatpak-payload-a.txt
            dist/flatpak-ostree-commit-a.txt
            dist/flatpak-bundle-sha256-a.txt
            flatpak-build.log
          if-no-files-found: error

  verify-flatpak:
    name: Verify Flatpak
    needs: build-flatpak
    runs-on: ubuntu-latest
    env:
      FLATPAK_BUILD_IMAGE: "ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the Flatpak artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64-flatpak
          path: download/

      - name: Verify the Flatpak bundle inside the pinned privileged container
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
          SPLOG_FLATPAK_STAGE: all
        run: |
          set -euo pipefail
          mkdir -p dist
          cp download/dist/* dist/
          IMAGE="${FLATPAK_BUILD_IMAGE}"
          docker pull "${IMAGE}"
          docker run --rm --privileged \
            -e EXPECTED_BUILD_COMMIT \
            -e SPLOG_FLATPAK_STAGE \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "${IMAGE}" \
            /bin/bash -c 'set -euo pipefail; export DEBIAN_FRONTEND=noninteractive; apt-get update; apt-get install -y --no-install-recommends flatpak flatpak-builder ostree appstream desktop-file-utils xvfb xauth python3 file binutils git ca-certificates; bash scripts/verify_linux_flatpak.sh dist/SPLogbook-Linux-x86_64-1.3.0-alpha.1.flatpak' \
            2>&1 | tee flatpak-verify.log
          test -s flatpak-verify.log
          grep -q "FLATPAK VERIFICATION COMPLETED SUCCESSFULLY" flatpak-verify.log

      - name: Upload the verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPLogbook-Linux-x86_64-flatpak-evidence
          path: |
            flatpak-verify.log
            dist/flatpak-permissions.txt
            dist/flatpak-build-info.txt
            dist/flatpak-ldd.txt
            dist/flatpak-gui-smoke.log
            dist/flatpak-verification.txt
          if-no-files-found: error

  verify-flatpak-permissions:
