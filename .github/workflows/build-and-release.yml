  verify-flatpak-determinism:
    name: Verify Flatpak determinism
    needs: build-flatpak
    runs-on: ubuntu-latest
    env:
      FLATPAK_BUILD_IMAGE: "ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
      FLATPAK_BUILD_IMAGE_DIGEST: "sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the first build and its payload evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SPLogbook-Linux-x86_64-flatpak
          path: download/

      - name: Build a second time from the same inputs and compare
        env:
          EXPECTED_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist reference
          cp download/dist/* dist/ || true
          cp dist/flatpak-payload-a.txt reference/
          cp dist/flatpak-ostree-commit-a.txt reference/
          cp dist/flatpak-bundle-sha256-a.txt reference/
          rm -f dist/flatpak-payload-a.txt dist/flatpak-payload-b.txt \
                dist/flatpak-ostree-commit-a.txt dist/flatpak-ostree-commit-b.txt \
                dist/flatpak-bundle-sha256-a.txt dist/flatpak-bundle-sha256-b.txt
          IMAGE="${FLATPAK_BUILD_IMAGE}"
          docker pull "${IMAGE}"
          docker run --rm --privileged \
            -e EXPECTED_BUILD_COMMIT \
            -e FLATPAK_BUILD_IMAGE \
            -e FLATPAK_BUILD_IMAGE_DIGEST \
            -e SPLOG_FLATPAK_BUILDS=1 \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "${IMAGE}" \
            /bin/bash -c 'set -euo pipefail; export DEBIAN_FRONTEND=noninteractive; apt-get update; apt-get install -y --no-install-recommends flatpak flatpak-builder ostree appstream desktop-file-utils xvfb xauth python3 file binutils git ca-certificates; bash scripts/build_linux_flatpak.sh dist/reference-build' \
            2>&1 | tee flatpak-rebuild.log
          test -s flatpak-rebuild.log
          grep -q "FLATPAK BUILD COMPLETED SUCCESSFULLY" flatpak-rebuild.log
          # Payload reproducibility: identical /app tree, modes and file digests.
          cmp reference/flatpak-payload-a.txt dist/reference-build/flatpak-payload-a.txt
          diff -u reference/flatpak-ostree-commit-a.txt dist/reference-build/flatpak-ostree-commit-a.txt \
            || echo "::notice::OSTree commits differ between independent builds"
          diff -u reference/flatpak-bundle-sha256-a.txt dist/reference-build/flatpak-bundle-sha256-a.txt \
            || echo "::notice::Bundle SHA-256 differs between independent builds"
          echo "PAYLOAD REPRODUCIBILITY VERIFIED"

      - name: Upload the determinism evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SPLogbook-Linux-x86_64-flatpak-determinism
          path: |
            flatpak-rebuild.log
            reference/flatpak-payload-a.txt
            dist/reference-build/flatpak-payload-a.txt
            dist/reference-build/flatpak-determinism.txt
            dist/reference-build/flatpak-toolchain.json
          if-no-files-found: error

